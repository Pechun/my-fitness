function todayStr(){return new Date().toISOString().slice(0,10);}

function parseAI(text){
  const result=[];let cur=null;
  const parts=text.split(/(星期[一二三四五六日][^\n]*)/);
  for(let i=0;i<parts.length;i++){
    if(/^星期[一二三四五六日]/.test(parts[i])){
      if(cur)result.push(cur);
      cur={title:parts[i].trim(),exercises:[]};
    } else if(cur){
      parts[i].split("\n").map(l=>l.trim()).filter(Boolean).forEach(line=>{
        if(line.includes("休息"))return;
        const s=line.split("|").map(x=>x.replace(/^[-•\d.]+\s*/,"").trim());
        if(s.length>=3)cur.exercises.push({name:s[0],sets:s[1],reps:s[2],weight:s[3]||"—",note:s[4]||"",steps:s[5]?s[5].split(/[；;]/).map(x=>x.trim()).filter(Boolean):[]});
      });
    }
  }
  if(cur)result.push(cur);
  return result.length>0?result:[{title:"課表",exercises:[]}];
}

function Ring({pct}){
  const r=22,circ=2*Math.PI*r,col=pct===100?C.grn:C.acc;
  return(
    <div style={{position:"relative",width:56,height:56,flexShrink:0}}>
      <svg width="56" height="56" viewBox="0 0 56 56" style={{transform:"rotate(-90deg)"}}>
        <circle cx="28" cy="28" r={r} fill="none" stroke={C.bd} strokeWidth="5"/>
        <circle cx="28" cy="28" r={r} fill="none" stroke={col} strokeWidth="5" strokeLinecap="round" strokeDasharray={`${pct/100*circ} ${circ}`}/>
      </svg>
      <div style={{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center",fontSize:12,fontWeight:700,color:col}}>{pct}%</div>
    </div>
  );
}

function Chip({label,on,click,orange}){
  const col=orange?C.acc2:C.acc;
  return <button onClick={click} style={{padding:"9px 14px",borderRadius:100,border:`1.5px solid ${on?col:C.bd}`,background:on?`${col}22`:C.s2,color:on?col:C.mut,fontSize:13,cursor:"pointer",fontFamily:"inherit",transition:"all .15s",fontWeight:on?600:400}}>{label}</button>;
}

function ExDetail({ex}){
  if(!ex.note&&(!ex.steps||ex.steps.length===0))return null;

    <div style={{padding:"12px 16px 16px",background:"#12121c",borderTop:`1px dashed ${C.bd}`}}>

  // ─── STATS PAGE ───
  function renderStats(){
    const todStr=todayStr();

    const week=Array.from({length:7},(_,i)=>{const d=new Date(mon);d.setDate(mon.getDate()+i);return d.toISOString().slice(0,10);});
    let streak=0;
    for(const k of Object.keys(logs).sort().reverse()){if(Object.values(logs[k].exercises||{}).some(e=>e.done))streak++;else break;}
    const weekDone=week.filter(d=>Object.values(logs[d]?.exercises||{}).some(e=>e.done)).length;

      <>

        <div style={{display:"flex",gap:10,padding:"12px 14px 0"}}>
          {[{n:streak,l:"連續天數 🔥"},{n:weekDone,l:"本週完成天"},{n:totalEx,l:"累計動作"}].map((s,i)=>(
            <div key={i} style={{flex:1,background:C.s1,border:`1px solid ${C.bd}`,borderRadius:12,padding:"14px 10px",textAlign:"center"}}>
              <div style={{fontSize:24,fontWeight:700,color:C.acc}}>{s.n}</div>
              <div style={{fontSize:11,color:C.mut,marginTop:4}}>{s.l}</div>
            </div>
          ))}
        </div>
        <div style={card}>
          <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:6,padding:14}}>
            {week.map((d,i)=>{
              const done=Object.values(logs[d]?.exercises||{}).some(e=>e.done);
              const isToday=d===todStr;const num=parseInt(d.slice(8));
              return(
                <div key={i} style={{display:"flex",flexDirection:"column",alignItems:"center",gap:5}}>
                  <div style={{fontSize:10,color:C.mut}}>{DAYS[i]}</div>
                  <div style={{width:32,height:32,borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",fontSize:12,fontWeight:600,border:`1.5px solid ${done?C.grn:isToday?C.acc:C.bd}`,background:done?C.grn:isToday?"rgba(139,127,247,.15)":C.s2,color:done?"#0d0d14":isToday?C.acc:C.mut}}>{num}</div>
                </div>
              );
            })}
          </div>
        </div>
        <div style={{fontSize:11,color:C.mut,padding:"14px 16px 4px",letterSpacing:".06em"}}>歷史紀錄</div>
        {Object.entries(logs).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,20).map(([d,lg])=>{
          const exDone=Object.values(lg.exercises||{}).filter(e=>e.done).length;
          if(exDone===0&&!lg.dayNote)return null;
          const dt=new Date(d);
          return(
            <div key={d} style={{...card,marginTop:0}}>
              <div style={{padding:"13px 16px",borderBottom:lg.dayNote?`1px solid ${C.bd}`:"none",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <span style={{fontSize:14,fontWeight:600}}>{dt.getMonth()+1}/{dt.getDate()}</span>
                <span style={{fontSize:12,color:exDone>0?C.grn:C.mut}}>{exDone>0?`✓ ${exDone} 個動作`:"未記錄"}</span>
              </div>
              {lg.dayNote&&<div style={{padding:"10px 16px",fontSize:13,color:C.mut,lineHeight:1.6}}>{lg.dayNote}</div>}
            </div>
          );
        })}
        <div style={{height:20}}/>
      </>
    );
  }

  // ─── SETUP PAGE ───
  function renderSetup(){
    if(generating){
      return(
        <div style={{padding:"28px 16px"}}>
          <div style={{fontSize:16,fontWeight:700,marginBottom:8}}>🗓️ 正在建立課表</div>
          <div style={{fontSize:12,color:C.mut,marginBottom:16,display:"flex",alignItems:"center",gap:6}}>
            AI 量身設計中
            <span style={{display:"inline-flex",gap:3}}>
              {[0,1,2].map(i=><span key={i} style={{width:5,height:5,background:C.acc,borderRadius:"50%",display:"inline-block",animation:`dn 1.1s ${i*.18}s ease infinite`}}/>)}
            </span>
            <style>{`@keyframes dn{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}`}</style>
          </div>
          <div style={{fontSize:13,lineHeight:1.85,whiteSpace:"pre-wrap",color:C.txt}}>{genText}</div>
        </div>
      );
    }
    if(schedule&&step===1){
      return(
        <>
          <div style={topbar}><div style={{fontSize:17,fontWeight:700}}>設定</div></div>
          <div style={{padding:"16px"}}>
            <div style={{...card,margin:0,marginBottom:12}}>
              <div style={cardHead}><span style={{fontSize:18}}>✅</span><span style={{fontSize:14,fontWeight:700}}>課表已建立</span></div>
              <div style={{padding:"13px 16px",fontSize:13,color:C.mut}}>課表已設定完成，前往「今天」開始訓練。</div>
            </div>
            <button onClick={()=>{setSchedule(DEFAULT_SCHEDULE);save(DEFAULT_SCHEDULE,logs);setDetailOpen(null);}} style={{...btnGrad,width:"100%",marginBottom:10}}>📖 套用一週四練課表（含注意事項＋動作分解）</button>
            <button onClick={()=>{setSchedule(null);save(null,logs);setStep(1);}} style={{...btnBack,width:"100%"}}>🔄 用 AI 重新建立課表</button>
          </div>
        </>
      );
    }
    const f=form;const TOTAL=5;
    const pBar=(
      <div style={{display:"flex",gap:4,marginBottom:22}}>
        {Array.from({length:TOTAL},(_,i)=><div key={i} style={{flex:1,height:3,borderRadius:100,background:i+1<step?C.grn:i+1===step?C.acc:C.bd,transition:"background .3s"}}/>)}
      </div>
    );
    const navRow=(isLast)=>(
      <div style={{display:"flex",gap:10,marginTop:20,paddingBottom:24}}>
        {step>1&&<button onClick={()=>setStep(s=>s-1)} style={btnBack}>← 返回</button>}
        <button onClick={isLast?generate:()=>setStep(s=>s+1)} style={isLast?{...btnGrad}:{...btnPrimary}}>
          {isLast?"✨ 生成課表":"下一步 →"}
        </button>
      </div>
    );
    return(
      <>
        <div style={topbar}><div style={{fontSize:17,fontWeight:700}}>建立課表</div></div>
        <div style={{padding:"20px 16px"}}>
          {step===1&&!schedule&&(
            <div style={{...card,margin:"0 0 16px",padding:"14px 16px",display:"flex",alignItems:"center",gap:12}}>
              <span style={{fontSize:24}}>📖</span>
              <div style={{flex:1}}>
                <div style={{fontSize:13,fontWeight:700}}>已經有現成的四天課表</div>
                <div style={{fontSize:11,color:C.mut,marginTop:2}}>含每個動作的注意事項與分解步驟</div>
              </div>
              <button onClick={()=>{setSchedule(DEFAULT_SCHEDULE);save(DEFAULT_SCHEDULE,logs);setTab("today");}} style={{padding:"9px 14px",borderRadius:10,border:"none",background:C.acc,color:"#fff",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit",flexShrink:0}}>直接套用</button>
            </div>
          )}
          {pBar}
          {step===1&&(
            <>
              <div style={{fontSize:19,fontWeight:700,marginBottom:6}}>你的目標 🎯</div>
              <div style={{fontSize:13,color:C.mut,marginBottom:20}}>選擇主要訓練方向（可多選）</div>
              <div style={{display:"flex",flexWrap:"wrap",gap:8,marginBottom:20}}>
                {GOALS.map(g=><Chip key={g} label={g} on={f.goals.includes(g)} click={()=>togF("goals",g)}/>)}
              </div>
              <div style={{marginBottom:18}}>
                <div style={{display:"flex",justifyContent:"space-between",marginBottom:10}}><span style={{fontSize:13,color:C.mut}}>每週天數</span><span style={{fontSize:16,color:C.acc,fontWeight:700}}>{f.days} 天</span></div>
                <input type="range" min="1" max="7" value={f.days} onChange={e=>setF("days",+e.target.value)} style={rangeStyle}/>
              </div>
              <div style={{marginBottom:4}}>
                <div style={{display:"flex",justifyContent:"space-between",marginBottom:10}}><span style={{fontSize:13,color:C.mut}}>每次時長</span><span style={{fontSize:16,color:C.acc,fontWeight:700}}>{f.mins} 分鐘</span></div>
                <input type="range" min="20" max="120" step="10" value={f.mins} onChange={e=>setF("mins",+e.target.value)} style={rangeStyle}/>
              </div>
              {navRow(false)}
            </>
          )}
          {step===2&&(
            <>
              <div style={{fontSize:19,fontWeight:700,marginBottom:6}}>目前狀況 📊</div>
              <div style={{fontSize:13,color:C.mut,marginBottom:16}}>誠實評估才能得到最適合的課表</div>
              {LEVELS.map((l,i)=>(
                <div key={i} onClick={()=>setF("level",i)} style={{display:"flex",alignItems:"center",gap:12,padding:"15px",borderRadius:12,border:`1.5px solid ${f.level===i?C.acc:C.bd}`,background:f.level===i?"rgba(139,127,247,.1)":C.s2,cursor:"pointer",marginBottom:8}}>
                  <span style={{fontSize:22}}>{l.e}</span>
                  <div><div style={{fontSize:14,fontWeight:600,color:f.level===i?C.acc:C.txt}}>{l.n}</div><div style={{fontSize:11,color:C.mut}}>{l.d}</div></div>
                </div>
              ))}
              <div style={{marginTop:8,marginBottom:14}}>
                <div style={{display:"flex",justifyContent:"space-between",marginBottom:10}}><span style={{fontSize:13,color:C.mut}}>體重</span><span style={{fontSize:16,color:C.acc,fontWeight:700}}>{f.bw} kg</span></div>
                <input type="range" min="40" max="150" value={f.bw} onChange={e=>setF("bw",+e.target.value)} style={rangeStyle}/>
              </div>
              <div style={{display:"flex",gap:8,marginBottom:14}}>
                {["男性","女性","不指定"].map(g=>(
                  <button key={g} onClick={()=>setF("gender",g)} style={{flex:1,padding:"12px",borderRadius:10,border:`1.5px solid ${f.gender===g?C.acc:C.bd}`,background:f.gender===g?"rgba(139,127,247,.12)":C.s2,color:f.gender===g?C.acc:C.mut,fontSize:13,fontWeight:f.gender===g?700:400,cursor:"pointer",fontFamily:"inherit"}}>{g}</button>
                ))}
              </div>
              <div style={{display:"flex",flexWrap:"wrap",gap:8,marginBottom:12}}>
                {INJURIES.map(i=><Chip key={i} label={i} on={f.injuries.includes(i)} click={()=>togF("injuries",i)} orange/>)}
              </div>
              <textarea style={taStyle} placeholder="其他傷病說明..." value={f.injNote} onChange={e=>setF("injNote",e.target.value)}/>
              {navRow(false)}
            </>
          )}
          {step===3&&(
            <>
              <div style={{fontSize:19,fontWeight:700,marginBottom:6}}>器材設備 🔧</div>
              <div style={{fontSize:13,color:C.mut,marginBottom:16}}>選擇你實際可用的器材</div>
              <div style={{display:"flex",flexWrap:"wrap",gap:8,marginBottom:16}}>
                {PLACES.map(p=><Chip key={p} label={p} on={f.place===p} click={()=>setF("place",p)} orange/>)}
              </div>
              <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8}}>
                {EQUIPS.map(eq=>{
                  const s=f.equips.includes(eq.n);
                  return(
                    <button key={eq.n} onClick={()=>togF("equips",eq.n)} style={{display:"flex",flexDirection:"column",alignItems:"center",gap:6,padding:"14px 8px",borderRadius:12,border:`1.5px solid ${s?C.acc2:C.bd}`,background:s?"rgba(240,149,106,.12)":C.s2,cursor:"pointer"}}>
                      <span style={{fontSize:24}}>{eq.e}</span>
                      <span style={{fontSize:11,color:s?C.acc2:C.mut,fontWeight:s?600:400}}>{eq.n}</span>
                    </button>
                  );
                })}
              </div>
              {navRow(false)}
            </>
          )}
          {step===4&&(
            <>
              <div style={{fontSize:19,fontWeight:700,marginBottom:6}}>基準重量 🏆</div>
              <div style={{background:"rgba(139,127,247,.08)",border:"1px solid rgba(139,127,247,.2)",borderRadius:10,padding:"12px 14px",marginBottom:14,fontSize:12,color:C.mut,lineHeight:1.65}}>
                💡 填入能做 <strong style={{color:C.acc}}>5 下</strong> 的最大重量，讓 AI 推算訓練重量。不確定可空白。
              </div>
              <div style={{...card,margin:0,padding:0}}>
                {relBm.map((b,i)=>(
                  <div key={b.id} style={{display:"flex",alignItems:"center",gap:12,padding:"15px 16px",borderBottom:i<relBm.length-1?`1px solid ${C.bd}`:"none"}}>
                    <span style={{fontSize:22,width:30,flexShrink:0}}>{b.icon}</span>
                    <div style={{flex:1}}><div style={{fontSize:14,fontWeight:600}}>{b.name}</div><div style={{fontSize:11,color:C.mut,marginTop:2}}>{b.hint}</div></div>
                    <input type="number" inputMode="numeric" placeholder="—" value={f.bm[b.id]||""} onChange={e=>setBm(b.id,e.target.value)}
                      style={{width:68,background:C.s2,border:`1.5px solid ${f.bm[b.id]?C.acc:C.bd}`,borderRadius:9,color:C.txt,padding:"9px 8px",fontSize:16,fontFamily:"inherit",outline:"none",textAlign:"center"}}/>
                    <span style={{fontSize:12,color:C.mut,minWidth:18}}>{b.unit}</span>
                  </div>
                ))}
              </div>
              {navRow(false)}
            </>
          )}
          {step===5&&(
            <>
              <div style={{fontSize:19,fontWeight:700,marginBottom:6}}>飲食資訊 🥗</div>
              <div style={{fontSize:13,color:C.mut,marginBottom:16}}>搭配飲食建議（可多選）</div>
              <div style={{display:"flex",flexWrap:"wrap",gap:8,marginBottom:14}}>
                {DIETS.map(d=><Chip key={d} label={d} on={f.diets.includes(d)} click={()=>togF("diets",d)}/>)}
              </div>
              <textarea style={{...taStyle,marginBottom:10}} placeholder="補充品、過敏食材..." value={f.dietNote} onChange={e=>setF("dietNote",e.target.value)}/>
              <textarea style={taStyle} placeholder="其他想讓 AI 知道的事..." value={f.extra} onChange={e=>setF("extra",e.target.value)}/>
              {navRow(true)}
            </>
          )}
        </div>
      </>
    );
  }

  const pages={today:renderToday,schedule:renderSchedule,stats:renderStats,setup:renderSetup};

  return(
    <div style={{background:C.bg,height:"100%",fontFamily:"system-ui,-apple-system,'Noto Sans TC',sans-serif",color:C.txt,display:"flex",flexDirection:"column"}}>
      {/* Note modal */}
      {showNote&&(
        <div onClick={e=>{if(e.target===e.currentTarget)setShowNote(false);}} style={{position:"fixed",inset:0,background:"rgba(0,0,0,.65)",zIndex:50,display:"flex",alignItems:"flex-end",justifyContent:"center"}}>
          <div style={{width:"100%",maxWidth:480,background:C.s1,borderRadius:"20px 20px 0 0",padding:"20px 18px 32px"}}>
            <div style={{width:36,height:4,background:C.bd,borderRadius:100,margin:"0 auto 18px"}}/>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
              <div style={{fontSize:16,fontWeight:700}}>📝 今日備註</div>
              <button onClick={()=>setShowNote(false)} style={{background:"none",border:"none",color:C.mut,fontSize:24,cursor:"pointer"}}>×</button>
            </div>
            <textarea style={{...taStyle,minHeight:100}} placeholder="訓練感受、下次要調整..." value={noteVal} onChange={e=>setNoteVal(e.target.value)} autoFocus/>
            <button onClick={saveNote} style={{...btnPrimary,marginTop:12}}>儲存</button>
          </div>
        </div>
      )}
      {/* Content */}
      <div style={{flex:1,overflowY:"auto",WebkitOverflowScrolling:"touch"}}>
        {pages[tab]()}
      </div>
      {/* Nav */}
      <nav style={{display:"flex",background:C.s1,borderTop:`1px solid ${C.bd}`,flexShrink:0}}>
        {[{id:"today",icon:"🏠",label:"今天"},{id:"schedule",icon:"📋",label:"課表"},{id:"stats",icon:"📊",label:"紀錄"},{id:"setup",icon:"⚙️",label:"設定"}].map(n=>(
          <button key={n.id} onClick={()=>setTab(n.id)} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:3,background:"none",border:"none",cursor:"pointer",color:tab===n.id?C.acc:C.mut,fontSize:10,fontFamily:"inherit",padding:"10px 0"}}>
            <span style={{fontSize:22,lineHeight:1}}>{n.icon}</span>
            {n.label}
          </button>
        ))}
      </nav>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
